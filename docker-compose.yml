services:
  app:
    build: .
    container_name: ai-study-companion
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      STORAGE_DIR: /app/storage
      # Uncomment to use a local Ollama running on the host machine:
      # OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - study_storage:/app/storage
    restart: unless-stopped

  # Optional: fully offline inference. `docker compose --profile local up` then
  # `docker compose exec ollama ollama pull qwen2.5:7b` and set LLM_PROVIDER=ollama,
  # OLLAMA_BASE_URL=http://ollama:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: ["local"]
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  study_storage:
  ollama_models:
