<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>browser</title>
<style>
  :root { --tabs: #171a23; --chrome: #232734; --line: #313646; --txt: #e9ecf3; --dim: #9aa3b5; --brand: #6366f1; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1536px; height: 864px; transform: scale(1.25); transform-origin: 0 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background:
      radial-gradient(900px 640px at 85% 10%, rgba(99, 102, 241, 0.35), transparent 60%),
      radial-gradient(720px 560px at 5% 100%, rgba(16, 185, 129, 0.18), transparent 60%),
      linear-gradient(135deg, #101a33, #241a4a); }
  .window { position: absolute; left: 14px; top: 12px; width: 1508px; height: 840px; border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 26px 70px -18px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .tabs { height: 38px; background: var(--tabs); display: flex; align-items: flex-end; padding-left: 10px; position: relative; }
  .tab { height: 31px; width: 260px; background: var(--chrome); border-radius: 9px 9px 0 0; display: flex; align-items: center; gap: 9px; padding: 0 12px;
    color: var(--txt); font-size: 12.5px; font-weight: 500; }
  .tab svg { width: 16px; height: 16px; flex: none; }
  .tab .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tab .x { color: var(--dim); font-size: 11px; }
  .newtab { color: var(--dim); font-size: 20px; padding: 0 12px 6px; }
  .wctl { position: absolute; right: 0; top: 0; height: 38px; display: flex; }
  .wctl span { width: 46px; display: grid; place-items: center; color: var(--dim); font-size: 13px; }
  .toolbar { height: 42px; background: var(--chrome); display: flex; align-items: center; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .ic { width: 30px; height: 30px; display: grid; place-items: center; color: var(--dim); border-radius: 50%; }
  .ic svg { width: 17px; height: 17px; }
  .omni { flex: 1; height: 30px; margin: 0 8px; border-radius: 15px; background: #161922; display: flex; align-items: center; gap: 9px; padding: 0 14px;
    color: var(--txt); font-size: 14px; }
  .omni svg { width: 14px; height: 14px; color: var(--dim); flex: none; }
  .omni .path { color: var(--dim); }
  .omni .caret { display: inline-block; width: 1.5px; height: 16px; background: var(--txt); margin-left: 1px; animation: blink 1s steps(1) infinite; vertical-align: -3px; }
  @keyframes blink { 50% { opacity: 0; } }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: #4f46e5; color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-left: 4px; }
  iframe { position: absolute; left: 0; top: 80px; width: 1508px; height: 760px; border: 0; background: #f6f7fb; }

  #cursor { position: absolute; left: 0; top: 0; z-index: 100; width: 26px; height: 34px; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.35)); will-change: transform; }
  .ripple { position: absolute; z-index: 99; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
    background: rgba(99, 102, 241, 0.28); border: 2px solid rgba(99, 102, 241, 0.95); animation: ripple 0.55s ease-out forwards; }
  @keyframes ripple { from { transform: scale(0.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  #spot { position: absolute; z-index: 90; border-radius: 12px; pointer-events: none; opacity: 0;
    box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.95), 0 0 0 9999px rgba(15, 23, 42, 0.38);
    transition: left 0.45s cubic-bezier(.2,.7,.2,1), top 0.45s cubic-bezier(.2,.7,.2,1), width 0.45s cubic-bezier(.2,.7,.2,1), height 0.45s cubic-bezier(.2,.7,.2,1), opacity 0.35s ease; }
  #keycap { position: absolute; z-index: 95; left: 50%; bottom: 52px; transform: translateX(-50%) translateY(8px); opacity: 0; transition: opacity 0.2s, transform 0.2s;
    background: rgba(15, 23, 42, 0.9); color: #fff; border-radius: 14px; padding: 13px 22px; font: 600 21px "Segoe UI", system-ui; display: flex; gap: 10px; align-items: center; }
  #keycap kbd { font: 700 20px "Consolas", monospace; background: #fff; color: #0f172a; border-radius: 7px; padding: 3px 11px; box-shadow: 0 3px 0 #94a3b8; }
  #keycap.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #callout { position: absolute; z-index: 96; max-width: 640px; padding: 16px 22px; border-radius: 13px; background: #4f46e5; color: #fff;
    font: 600 20px/1.4 "Segoe UI", system-ui; box-shadow: 0 18px 44px -14px rgba(30, 27, 75, 0.85); opacity: 0; transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease; pointer-events: none; }
  #callout.on { opacity: 1; transform: translateY(0); }
  #callout code { font: 600 18px Consolas, monospace; background: rgba(255, 255, 255, 0.18); border-radius: 6px; padding: 1px 7px; }
</style>
</head>
<body>
  <div id="stage">
  <div class="window">
    <div class="tabs">
      <div class="tab">
        <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1a2440"/><path d="M32 16 10 27l22 11 22-11-22-11z" fill="#7b84ee"/><path d="M18 32v10c0 3.3 6.3 7 14 7s14-3.7 14-7V32l-14 7-14-7z" fill="#c3c8fb"/></svg>
        <span class="t" id="tabTitle">AI Study Companion</span><span class="x">✕</span>
      </div>
      <div class="newtab">+</div>
      <div class="wctl"><span>—</span><span>▢</span><span>✕</span></div>
    </div>
    <div class="toolbar">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg></span>
      <div class="omni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><span id="addr"><span class="host">localhost:5173</span><span class="path"></span></span></div>
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg></span>
      <span class="avatar">A</span>
    </div>
    <iframe id="app" name="app" src="about:blank"></iframe>
  </div>
  </div>
  <div id="spot"></div>
  <div id="keycap"></div>
  <div id="callout"></div>
  <div id="tick" style="position:absolute;left:0;top:0;width:2px;height:2px;background:#101a33"></div>
  <svg id="cursor" viewBox="0 0 21 27"><path d="M1.5 1.5v20.6l5.3-5.1 3.4 7.9 3.6-1.5-3.3-7.7h7.4z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script>
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const cursor = document.getElementById('cursor');
  let cx = 950, cy = 590;
  cursor.style.transform = `translate(${cx}px, ${cy}px)`;
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  window.cursorTo = (x, y, ms = 650) => new Promise((resolve) => {
    const x0 = cx, y0 = cy, t0 = performance.now();
    const bend = Math.min(60, Math.hypot(x - x0, y - y0) * 0.12);
    const step = (now) => {
      const t = Math.min(1, (now - t0) / ms), e = ease(t);
      const arc = Math.sin(Math.PI * e) * bend;
      cx = x0 + (x - x0) * e; cy = y0 + (y - y0) * e - arc;
      cursor.style.transform = `translate(${cx}px, ${cy}px)`;
      if (t < 1) requestAnimationFrame(step); else resolve(true);
    };
    requestAnimationFrame(step);
  });
  window.ripple = (x = cx, y = cy) => {
    const r = document.createElement('div'); r.className = 'ripple'; r.style.left = x + 'px'; r.style.top = y + 'px';
    document.body.appendChild(r); setTimeout(() => r.remove(), 700); return true;
  };
  window.spot = (rect, pad = 8) => {
    const s = document.getElementById('spot');
    if (!rect) { s.style.opacity = 0; return true; }
    const hidden = s.style.opacity !== '1';  // appear in place instead of sliding over from the last target
    if (hidden) s.style.transition = 'none';
    s.style.left = rect.x - pad + 'px'; s.style.top = rect.y - pad + 'px';
    s.style.width = rect.width + pad * 2 + 'px'; s.style.height = rect.height + pad * 2 + 'px';
    if (hidden) { void s.offsetWidth; s.style.transition = ''; }
    s.style.opacity = 1; return true;
  };
  window.keycap = (label, hint) => {
    const k = document.getElementById('keycap');
    k.innerHTML = `<kbd>${label}</kbd>${hint ? `<span>${hint}</span>` : ''}`;
    k.classList.add('on'); clearTimeout(window.__kc); window.__kc = setTimeout(() => k.classList.remove('on'), 1100); return true;
  };
  let tickOn = false;
  window.tick = () => { tickOn = !tickOn; document.getElementById('tick').style.background = tickOn ? '#101a34' : '#101a33'; return true; };
  window.callout = (html, x, y) => {
    const c = document.getElementById('callout');
    if (!html) { c.classList.remove('on'); return true; }
    c.innerHTML = html; c.style.left = x + 'px'; c.style.top = y + 'px'; c.classList.add('on'); return true;
  };

  // address bar: follows the app frame unless a manual address is set
  let manual = null;
  const addr = document.getElementById('addr');
  function renderAddr(host, path) { addr.innerHTML = `<span class="host">${host}</span><span class="path">${path}</span>`; }
  window.setAddress = (text) => { manual = text; if (text) { const i = text.indexOf('/'); renderAddr(i < 0 ? text : text.slice(0, i), i < 0 ? '' : text.slice(i)); } return true; };
  window.typeAddress = async (text, cps = 22) => {
    manual = text; addr.innerHTML = '<span class="host"></span><span class="caret"></span>';
    const host = addr.querySelector('.host');
    for (const ch of text) { host.textContent += ch; await sleep(1000 / cps * (0.6 + Math.random() * 0.8)); }
    await sleep(250); addr.querySelector('.caret')?.remove(); return true;
  };
  setInterval(() => {
    const f = document.getElementById('app');
    try {
      const loc = f.contentWindow.location;
      if (!manual && loc.href !== 'about:blank') renderAddr(loc.host, loc.pathname === '/' && !loc.search ? '' : loc.pathname + loc.search);
      const title = f.contentDocument && f.contentDocument.title;
      if (title) document.getElementById('tabTitle').textContent = title;
    } catch (e) { /* cross-origin page: keep the manual address */ }
  }, 120);
</script>
</body>
</html>
